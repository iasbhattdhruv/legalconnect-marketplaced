{% extends 'base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="card p-8 shadow-card bg-white">
        <h1 class="text-3xl font-semibold text-slate-900 mb-6">{{ page_title|default:'Create New User' }}</h1>

        <form method="post" class="space-y-6">
            {% csrf_token %}

            <div class="grid md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">Username</label>
                    <input type="text" name="username" required
                           class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-3 text-slate-900 focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">Email</label>
                    <input type="email" name="email" required
                           class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-3 text-slate-900 focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
            </div>

            <div class="grid md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">First Name</label>
                    <input type="text" name="first_name"
                           class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-3 text-slate-900 focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">Last Name</label>
                    <input type="text" name="last_name"
                           class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-3 text-slate-900 focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">Password</label>
                <input type="password" name="password" required
                       class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-3 text-slate-900 focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            </div>

            {% if hide_user_type %}
                <input type="hidden" name="user_type" value="{{ fixed_user_type|default:'client' }}" />
            {% else %}
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">User Type</label>
                    <select name="user_type" required
                            class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-3 text-slate-900 focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        <option value="client">Client</option>
                        <option value="lawyer">Lawyer</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
            {% endif %}

            <div id="lawyer-fields" class="{% if hide_user_type and fixed_user_type == 'lawyer' %}space-y-6{% else %}hidden space-y-6{% endif %}">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">Specialization</label>
                    <select name="specialization" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-3 text-slate-900 focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        <option value="">Select specialization</option>
                        <option value="Criminal Law">Criminal Law</option>
                        <option value="Family Law">Family Law</option>
                        <option value="Corporate Law">Corporate Law</option>
                        <option value="Property Law">Property Law</option>
                        <option value="Intellectual Property">Intellectual Property</option>
                        <option value="Employment Law">Employment Law</option>
                        <option value="Immigration Law">Immigration Law</option>
                        <option value="Tax Law">Tax Law</option>
                        <option value="Civil Rights">Civil Rights</option>
                        <option value="General Legal">General Legal</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">Years of Experience</label>
                    <input type="number" name="experience" min="0"
                           class="w-full bg-slate-50 border border-slate-200 rounded-lg px-4 py-3 text-slate-900 focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
            </div>

            <button type="submit" class="w-full btn-primary py-3">
                {{ submit_label|default:'Create User' }}
            </button>
        </form>
    </div>
</div>

<script>
const userTypeSelect = document.querySelector('select[name="user_type"]');
const lawyerFields = document.getElementById('lawyer-fields');
if (userTypeSelect && lawyerFields) {
    userTypeSelect.addEventListener('change', function() {
        if (this.value === 'lawyer') {
            lawyerFields.classList.remove('hidden');
        } else {
            lawyerFields.classList.add('hidden');
        }
    });
}
</script>
{% endblock %}
