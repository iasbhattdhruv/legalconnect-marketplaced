{% extends 'base.html' %}

{% block content %}

<div class="flex min-h-[75vh] items-center justify-center">
    <div class="card w-full max-w-md p-8">
        <div class="mb-8 text-center">
            <p class="text-sm uppercase tracking-[0.3em] text-sky-400">Welcome back</p>
            <h1 class="mt-3 text-3xl font-semibold text-white">Sign in to LegalConnect</h1>
            <p class="mt-2 text-slate-400">Access your dashboard, appointments, and lawyer bookings.</p>
        </div>

        <form method="POST" class="space-y-5">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">

            <div>
                <label class="mb-2 block text-sm font-semibold text-slate-200">Username</label>
                <input type="text" name="username" placeholder="Enter your username" class="input-field" required>
            </div>

            <div>
                <label class="mb-2 block text-sm font-semibold text-slate-200">Password</label>
                <input type="password" name="password" placeholder="Enter your password" class="input-field" required>
            </div>

            <button type="submit" class="btn-primary w-full">Login</button>
        </form>

        <p class="mt-6 text-center text-slate-400">
            Don't have an account?
            <a href="/register/" class="text-sky-300 font-semibold hover:text-white">Create one</a>
        </p>
    </div>
</div>

{% endblock %}
